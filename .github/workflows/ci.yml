name: KMP Autonomous CI/CD Pipeline

on:
  push:
    branches:
      - main

# Crucial: Grant the workflow permissions to configure and deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in progress if a newer one comes in
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      # --- STEP 1: LINT & UNIT TEST ---
      - name: Run Code Analysis & Tests
        run: ./gradlew check

      # --- STEP 2: SONARCLOUD ANALYSIS ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- STEP 3: BUILD WEB TARGET ---
      - name: Build Web Production Distribution
        run: ./gradlew composeApp:wasmJsBrowserDistribution

      # --- STEP 4: UPLOAD SITE ARTIFACT ---
      # This zips up the KMP production build and readies it for GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      # --- STEP 5: DEPLOY TO GITHUB PAGES ---
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
